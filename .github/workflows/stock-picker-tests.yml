name: Stock picker tests

on:
  push:
    branches:
      - stock-picker-v1
  pull_request:
    paths:
      - "stock_picker/**"
      - "tests/test_stock_picker.py"
      - "requirements-stock-picker.txt"
      - ".github/workflows/stock-picker-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip numpy pandas pytest

      - name: Run stock picker tests
        run: python -m pytest tests/test_stock_picker.py -q
